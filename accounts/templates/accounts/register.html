{% extends 'base.html' %}
{% block title %}Sign up — LoopSync{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <h2 class="mb-3">Sign up</h2>
        <form method="post">
            {% csrf_token %}
            {% for field in form %}
                <div class="mb-3">
                    <label class="form-label">{{ field.label }}</label>
                    {{ field }}
                    {% if field.errors %}
                        <div class="text-danger small">{{ field.errors }}</div>
                    {% endif %}
                </div>
            {% endfor %}
            <button type="submit" class="btn btn-primary w-100">Sign up</button>
        </form>
        <p class="mt-3">Already have an account? <a href="{% url 'accounts:login' %}">Log in</a></p>
    </div>
</div>
{% endblock %}
