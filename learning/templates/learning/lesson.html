{% extends 'base.html' %}
{% block title %}{{ lesson.title }} — LoopSync{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-7">
        <p class="text-muted mb-1">{{ language.name }} · Lesson {{ lesson.lesson_order }}</p>
        <h2 class="mb-3">{{ lesson.title }}</h2>
        <div class="card mb-4">
            <div class="card-body">
                <p style="white-space: pre-wrap;">{{ lesson.contents }}</p>
            </div>
        </div>
        <form method="post" action="{% url 'learning:mark_progress' %}">
            {% csrf_token %}
            <input type="hidden" name="lesson_id" value="{{ lesson.id }}">
            <button type="submit" class="btn btn-success">Mark lesson complete</button>
        </form>
    </div>
</div>
{% endblock %}
