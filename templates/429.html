{% extends "base.html" %}
{% block title %}Slow down | {{ site_name|default:"Language Exchange Matcher" }}{% endblock %}
{% block content %}
<section class="lx-error">
  <div class="container">
    <span class="lx-icon-badge lx-icon-badge--lg"><i class="bi bi-hourglass-split" aria-hidden="true"></i></span>
    <p class="lx-error__code">Error 429</p>
    <h1>Too many attempts</h1>
    <p class="lx-lead mt-3">{{ message|default:"Please wait a while and try again." }}</p>
    <a class="btn btn-primary btn-lg mt-3" href="{% url 'core:home' %}">Go to the home page</a>
  </div>
</section>
{% endblock %}
