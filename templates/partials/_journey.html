{# A1 → C2 track marking the learner's real estimated level. Needs: rank (1–6), code. #}
<ol class="lx-journey" aria-label="Estimated level {{ code }} on the A1 to C2 scale">
  {% for _ in "123456" %}
  <li class="lx-journey__step{% if forloop.counter < rank %} is-past{% elif forloop.counter == rank %} is-current{% endif %}"{% if forloop.counter == rank %} aria-current="step"{% endif %}>
    <span class="lx-journey__dot" aria-hidden="true"></span>
    <span class="lx-journey__label">{% cycle 'A1' 'A2' 'B1' 'B2' 'C1' 'C2' %}</span>
  </li>
  {% endfor %}
</ol>
