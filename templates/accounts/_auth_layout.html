{% extends "base.html" %}
{% block content %}
<section class="lx-auth">
  <div class="lx-auth__split">
    <aside class="lx-auth__aside" aria-hidden="true">
      <p class="lx-auth__statement">Every conversation is<br><em>two lessons at once.</em></p>
      <div class="lx-auth__phrases">
        <span>Where are you from?</span>
        <span lang="hi">आप कहाँ से हैं?</span>
        <span lang="bn">আপনি কোথা থেকে?</span>
      </div>
    </aside>
    <div class="lx-auth__main">
      <div class="lx-auth__panel">
        <div class="lx-auth__head">
          <span class="lx-icon-badge lx-icon-badge--lg"><i class="bi {% block icon %}bi-person{% endblock %}" aria-hidden="true"></i></span>
          <h1 class="lx-auth__title">{% block heading %}{% endblock %}</h1>
          {% block intro %}{% endblock %}
        </div>
        <div class="lx-card lx-card--raised">
          <div class="lx-card__body">{% block panel %}{% endblock %}</div>
        </div>
        {% block after_panel %}{% endblock %}
      </div>
    </div>
  </div>
</section>
{% endblock %}
